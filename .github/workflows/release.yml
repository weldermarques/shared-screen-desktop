name: Desktop release

# Publicar uma versão:  git tag v1.2.3 && git push origin v1.2.3
# Toda release publicada é uma atualização OBRIGATÓRIA para quem tem versão anterior.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-build.txt

      - name: Instalar Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build (exe + instalador)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TURN_URL: ${{ secrets.TURN_URL }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          GITHUB_REPO: ${{ github.repository }}
        run: ./build.ps1 -Version "${{ github.ref_name }}"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/SharedScreen-Setup-*.exe
          generate_release_notes: true
